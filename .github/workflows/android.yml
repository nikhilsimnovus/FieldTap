# Android CI: unit tests, lint and the APKs, then the end-to-end proof on emulators at API 36 and API 31
# (android/e2e/run_e2e.sh), followed by a probe of what each emulator's radio, location and networks provide. Beside
# them, the release job builds the signed, minified release APK and drives it on emulators at API 36 and API 31
# (android/e2e/release_smoke.sh).
name: Android

on:
  push:
    branches: [android-app]
    paths:
      - "android/**"
      - "schema/**"
      - "tests/fixtures/**"
      - "fieldtap/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "schema/**"
      - "tests/fixtures/**"
      - "fieldtap/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  # A new PR push cancels the old run; every push to android-app runs to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Basic caching is the MIT provider built on actions/cache. The default
      # "enhanced" provider is proprietary and binds the repo to Gradle's Terms of Use.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          # The default is read-only off the default branch; let pushes write it.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Unit tests, lint and APKs
        run: |
          tasks=(:format:test :core:test :app:testDebugUnitTest :app:assembleDebug :app:lintDebug :app:assembleRelease)
          # The instrumented-test APK, once an androidTest source set exists.
          if [ -d app/src/androidTest ]; then tasks+=(:app:assembleDebugAndroidTest); fi
          ./gradlew --stacktrace "${tasks[@]}"

      # The automation hook lives in src/debug only (android/ARCHITECTURE.md section 9): a release APK must
      # not export it. The debug APK is checked too, so a check that cannot see the hook fails instead of passing.
      - name: Release APK has no debug automation hook
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt2"
          release_apk=$(ls app/build/outputs/apk/release/*.apk)
          debug_apk=$(ls app/build/outputs/apk/debug/*.apk)
          release_manifest=$("$aapt2" dump xmltree --file AndroidManifest.xml "$release_apk")
          debug_manifest=$("$aapt2" dump xmltree --file AndroidManifest.xml "$debug_apk")
          if ! grep -q "com.fieldtap.debug.AutomationActivity" <<< "$debug_manifest"; then
            echo "The debug APK does not declare the automation hook; this check cannot be trusted"
            exit 1
          fi
          if grep -q "com.fieldtap.debug" <<< "$release_manifest"; then
            echo "The release APK declares the debug automation hook"
            exit 1
          fi
          echo "OK: ${release_apk##*/} has no com.fieldtap.debug entry; ${debug_apk##*/} has the hook"

      # No release key is configured here, so the release APK must come out unsigned: a key never reaches this job.
      - name: Release APK is unsigned and minified without a release key
        run: |
          test -s app/build/outputs/apk/release/app-release-unsigned.apk || { echo "no app-release-unsigned.apk"; ls app/build/outputs/apk/release; exit 1; }
          test -s app/build/outputs/mapping/release/mapping.txt || { echo "R8 did not run: no mapping.txt"; exit 1; }
          echo "OK: app-release-unsigned.apk, $(stat -c %s app/build/outputs/apk/release/app-release-unsigned.apk) bytes after R8"

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            android/*/build/reports/
            android/*/build/test-results/
          if-no-files-found: ignore

  # The end-to-end proof, android/e2e/run_e2e.sh: the real UI from first run to a shared zip while a GPS walk and signal
  # changes are fed, process death and recovery, screenshots of every screen in light, dark and font scale 1.3, and
  # fieldtap validate and report on every session. API 36 is the version the app targets and must pass; API 31 is its
  # minSdk. The capability probe runs after the proof has passed, on the same emulator.
  emulator:
    name: emulator (API ${{ matrix.api }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        api: [36, 31]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: apks
          path: ${{ runner.temp }}/apks

      # fieldtap validate and fieldtap report, and android/e2e/check_e2e.py (standard library only).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Exactly as the reactivecircus/android-emulator-runner README documents.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: End-to-end proof on API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_DIR: ${{ runner.temp }}/apks
          E2E_OUT: ${{ runner.temp }}/e2e
          PROBE_OUT: ${{ runner.temp }}/emulator-probe
          PYTHON: python
          WALK_SECONDS: "180"
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          cores: 3
          ram-size: 4096M
          disk-size: 8G
          emulator-options: "-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none"
          disable-animations: true
          # The runner runs each line on its own and stops at the first that fails.
          script: |
            bash android/e2e/run_e2e.sh
            bash android/e2e/probe.sh

      - name: Summary
        if: always()
        shell: bash
        run: |
          summary="$RUNNER_TEMP/e2e/summary.txt"
          { echo "### End-to-end proof, API ${{ matrix.api }}"; echo '```'; cat "$summary" 2>/dev/null || echo "no summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sessions and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-sessions-api${{ matrix.api }}
          path: |
            ${{ runner.temp }}/e2e/sessions/
            ${{ runner.temp }}/e2e/device/*.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots-api${{ matrix.api }}
          path: |
            ${{ runner.temp }}/e2e/device/screenshots/
            ${{ runner.temp }}/e2e/device/failures/
            ${{ runner.temp }}/e2e/recovery/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logcat-api${{ matrix.api }}
          path: ${{ runner.temp }}/e2e/logcat/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports-api${{ matrix.api }}
          path: |
            ${{ runner.temp }}/e2e/summary.txt
            ${{ runner.temp }}/e2e/e2e.log
            ${{ runner.temp }}/e2e/instrumentation/
            ${{ runner.temp }}/e2e/validate/
            ${{ runner.temp }}/e2e/checks/
            ${{ runner.temp }}/e2e/device/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-probe-api${{ matrix.api }}
          path: ${{ runner.temp }}/emulator-probe
          if-no-files-found: ignore
          retention-days: 30

  # The release build as a phone gets it: R8-minified, resources shrunk, not debuggable, and signed. The instrumented
  # proof above runs the debug build, so only this shows a class, keep rule or resource that R8 got wrong. The key is made
  # in this job and deleted as soon as Gradle has signed the APK, through the same signing config that reads the real key
  # on the release PC (android/README.md, "Release key"): no keystore or password is kept anywhere.
  # android/e2e/release_smoke.sh drives the APK with nothing but "uiautomator dump" and "input tap" on visible text:
  # first run, the version in About, a session with tests while a GPS walk is fed, Stop, then fieldtap validate --upload
  # and fieldtap report on the pulled session. API 36 is the target; API 31, the minSdk, runs R8's code paths for older
  # platforms.
  release:
    name: release build (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api: [36, 31]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Read-only: the build job saves the cache, and jobs saving the same key at once would race.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build the release APK, signed with a key made for this job
        shell: bash
        working-directory: android
        run: |
          key_dir="$RUNNER_TEMP/release-key"
          trap 'rm -rf "$key_dir"' EXIT
          mkdir -m 700 -p "$key_dir"
          openssl rand -hex 32 > "$key_dir/password.txt"
          keytool -genkeypair -keystore "$key_dir/release.jks" -storetype PKCS12 \
            -storepass:file "$key_dir/password.txt" -keypass:file "$key_dir/password.txt" \
            -alias 5gto6g-fieldtap -keyalg RSA -keysize 2048 -validity 2 -dname "CN=5gto6g CI release test" > /dev/null
          FIELDTAP_RELEASE_STORE_FILE="$key_dir/release.jks" FIELDTAP_RELEASE_STORE_PASSWORD_FILE="$key_dir/password.txt" \
            ./gradlew --stacktrace :app:assembleRelease

      # Signed, minified (R8 wrote its mapping), not debuggable, the version app/build.gradle.kts sets, no automation hook.
      - name: Check the release APK
        shell: bash
        working-directory: android
        run: |
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk" || { echo "no signed app-release.apk"; ls app/build/outputs/apk/release; exit 1; }
          test -s app/build/outputs/mapping/release/mapping.txt || { echo "R8 did not run: no mapping.txt"; exit 1; }
          "${build_tools}apksigner" verify --verbose --print-certs "$apk"
          version_name=$(sed -n 's/^ *versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          version_code=$(sed -n 's/^ *versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)
          badging=$("${build_tools}aapt2" dump badging "$apk")
          manifest=$("${build_tools}aapt2" dump xmltree --file AndroidManifest.xml "$apk")
          if ! grep -q "versionCode='$version_code' versionName='$version_name'" <<< "$badging"; then
            echo "The release APK is not version $version_name ($version_code):"; head -n 1 <<< "$badging"; exit 1
          fi
          if grep -q "application-debuggable" <<< "$badging"; then echo "The release APK is debuggable"; exit 1; fi
          if grep -q "com.fieldtap.debug" <<< "$manifest"; then echo "The release APK declares the debug automation hook"; exit 1; fi
          echo "OK: ${apk##*/}, $(stat -c %s "$apk") bytes, version $version_name ($version_code): signed, minified, not debuggable, no automation hook"

      # Exactly as the reactivecircus/android-emulator-runner README documents.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Drive the release build on API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          RELEASE_APK: ${{ github.workspace }}/android/app/build/outputs/apk/release/app-release.apk
          RELEASE_OUT: ${{ runner.temp }}/release-smoke
          RECORD_SECONDS: "90"
          PYTHON: python
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          cores: 3
          ram-size: 4096M
          disk-size: 8G
          emulator-options: "-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none"
          disable-animations: true
          script: bash android/e2e/release_smoke.sh

      - name: Summary
        if: always()
        shell: bash
        run: |
          summary="$RUNNER_TEMP/release-smoke/summary.txt"
          { echo "### Release build, API ${{ matrix.api }}"; echo '```'; cat "$summary" 2>/dev/null || echo "no summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-smoke-api${{ matrix.api }}
          path: ${{ runner.temp }}/release-smoke
          if-no-files-found: warn
          retention-days: 30

      # Signed with this job's throwaway key: for diagnosis only, never for a phone. mapping.txt turns an obfuscated
      # stack trace back into names.
      - name: Upload the release APK and its R8 mapping
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-apk-api${{ matrix.api }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 14
