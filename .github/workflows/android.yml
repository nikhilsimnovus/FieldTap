# Android CI: unit tests and the debug APK, then a probe of what a real emulator's
# radio, location and networks provide (uploaded as the emulator-probe artifact).
name: Android

on:
  push:
    branches: [android-app]
    paths:
      - "android/**"
      - "schema/**"
      - "tests/fixtures/**"
      - "fieldtap/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "schema/**"
      - "tests/fixtures/**"
      - "fieldtap/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  # A new PR push cancels the old run; every push to android-app runs to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Basic caching is the MIT provider built on actions/cache. The default
      # "enhanced" provider is proprietary and binds the repo to Gradle's Terms of Use.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          # The default is read-only off the default branch; let pushes write it.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Unit tests and debug APK
        run: |
          tasks=(:format:test :core:test :app:testDebugUnitTest :app:assembleDebug)
          # The instrumented-test APK, once an androidTest source set exists.
          if [ -d app/src/androidTest ]; then tasks+=(:app:assembleDebugAndroidTest); fi
          ./gradlew --stacktrace "${tasks[@]}"

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            android/*/build/reports/
            android/*/build/test-results/
          if-no-files-found: ignore

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: apks
          path: ${{ runner.temp }}/apks

      # Exactly as the reactivecircus/android-emulator-runner README documents.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 36 google_apis x86_64, or API 35 if Google stops offering that image.
      - name: Choose system image
        id: image
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || sdkmanager=sdkmanager
          "$sdkmanager" --list > "$RUNNER_TEMP/sdk-list.txt" 2>&1 || true
          grep -E 'system-images;android-3[56];google_apis;x86_64' "$RUNNER_TEMP/sdk-list.txt" || true
          if grep -q 'system-images;android-36;google_apis;x86_64' "$RUNNER_TEMP/sdk-list.txt"; then api=36; else api=35; fi
          echo "Using API $api"
          echo "api=$api" >> "$GITHUB_OUTPUT"

      - name: Probe the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_DIR: ${{ runner.temp }}/apks
          PROBE_OUT: ${{ runner.temp }}/emulator-probe
        with:
          api-level: ${{ steps.image.outputs.api }}
          target: google_apis
          arch: x86_64
          cores: 3
          ram-size: 4096M
          disk-size: 8G
          emulator-options: "-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none"
          disable-animations: true
          script: bash android/e2e/probe.sh

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-probe
          path: ${{ runner.temp }}/emulator-probe
          if-no-files-found: warn
          retention-days: 30
