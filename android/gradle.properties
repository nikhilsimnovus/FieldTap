# Memory: the Windows development PC has 7.8 GB and runs no emulator, so keep the Gradle
# daemon, its workers and the Kotlin daemon small.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.daemon.jvmargs=-Xmx1g
kotlin.code.style=official

# The Android applicationId. It is a working ID and changes before the package is
# registered, so it is defined here and read by app/build.gradle.kts, nowhere else.
fieldtap.applicationId=com.fieldtap
